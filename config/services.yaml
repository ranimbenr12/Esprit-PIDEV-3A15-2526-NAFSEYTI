parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            Symfony\Component\RateLimiter\RateLimiterFactory $testSubmissionLimiter: '@limiter.test_submission'
            Symfony\Component\RateLimiter\RateLimiterFactory $testViewLimiter: '@limiter.test_view'
            string $adminEmail: '%env(ADMIN_EMAIL)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\GeminiService:
        arguments:
              $nafseytiAiKey: '%env(NAFSEYTI_AI_KEY)%'

    App\Service\FaceppService:
        arguments:
            $faceppApiKey:    '%env(FACEPP_API_KEY)%'
            $faceppApiSecret: '%env(FACEPP_API_SECRET)%'

  # ✅ CORRECT - arguments indenté sous le service
    App\Service\SpotifyService:
        arguments:
            $spotifyClientId:     '%env(SPOTIFY_CLIENT_ID)%'
            $spotifyClientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'